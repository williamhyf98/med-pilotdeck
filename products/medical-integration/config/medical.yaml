version: 1

api:
  host: "127.0.0.1"
  port: 8765

mcp:
  enabled: true
  host: "127.0.0.1"
  port: 8766
  path: "/mcp"

data:
  root: "../data"

embedding:
  # 原项目未交付 embedding 服务凭据；文本检索在配置内网服务前保持禁用。
  enabled: false
  endpoint: null
  allowed_hosts: []
  timeout_seconds: 10
  max_response_bytes: 4194304

ingestion:
  max_files: 32
  max_file_bytes: 52428800
  max_total_bytes: 209715200
  max_directory_depth: 8
  max_pages: 100
  max_frames: 64
  max_pixels: 100000000

rag:
  default_top_k: 3
  max_top_k: 8
  default_min_score: 0.75
  max_corpus_bytes: 536870912
  max_embedding_bytes: 4294967296
  max_rows: 1000000
  max_dimension: 16384
  corpus_id: "war-trauma"
  version: "b507f26"
  corpus_path: "rag/output/corpus/war_trauma_books_chunks.jsonl"
  embedding_path: "rag/embedding/war_trauma_books_embedding.npy"
  corpus_sha256: "47b8dba80215f94dfd4021b318f6451bdd59d1fb81ac374f486cf9f141ce2a5e"
  embedding_sha256: "8d55d77fbe3c45081e51ec9d096824552340b94bed7141904b138605b6bdf331"
  embedding_model: "remote-2048d-artifact"
  license_id: "user-confirmed-authorized-2026-08-06"

table:
  max_columns: 256
  max_rows: 10000
  max_cell_chars: 32768

imaging:
  max_volume_bytes: 536870912
  max_voxels: 536870912
  max_preview_slices: 64
  max_gallery_slices: 4096

gallery:
  enabled: true
  root: "med-trauma"
  max_cases_per_dataset: 10000
  max_slice_bytes: 52428800
  slice_extensions: [".png", ".jpg", ".jpeg", ".bmp", ".webp"]
  datasets:
    - id: "war-trauma-demo"
      path: "war_trauma"
      label: "战创伤授权演示影像"
      modality: "mixed"
      version: "b507f26"
      license_id: "user-confirmed-authorized-2026-08-06"
      report_names: []

volume_storage:
  mode: "temporary"
  root: "volumes"
  default_ttl_seconds: 900
  max_ttl_seconds: 86400
  max_items: 32
  max_stored_bytes: 1073741824
  persist_phi: false

m3d:
  enabled: false
  endpoint: "http://127.0.0.1:8770"
  health_path: "/health"
  infer_path: "/v1/infer"
  timeout_seconds: 2
  max_response_bytes: 16777216

workflows:
  max_sources: 32
  max_source_chars: 100000
  max_total_chars: 500000
  max_output_chars: 2000000
