version: 1

api:
  host: "127.0.0.1"
  port: 8765

mcp:
  enabled: true
  host: "127.0.0.1"
  port: 8766
  path: "/mcp"

# 所有 Gallery、RAG 与持久化 Volume 路径都必须是此可信根下的相对路径。
# 相对 data.root 以本配置文件所在目录为基准解析。
data:
  root: "../data"

# 默认禁用。启用时 endpoint 主机必须精确出现在 allowed_hosts，
# 并且 DNS 的全部解析结果必须属于 loopback/private 地址；link-local 被拒绝。
embedding:
  enabled: false
  endpoint: null
  allowed_hosts: []
  timeout_seconds: 10
  max_response_bytes: 4194304

ingestion:
  max_files: 32
  max_file_bytes: 52428800
  max_total_bytes: 209715200
  max_directory_depth: 8
  max_pages: 100
  max_frames: 64
  max_pixels: 100000000

rag:
  default_top_k: 3
  max_top_k: 8
  default_min_score: 0.75
  max_corpus_bytes: 536870912
  max_embedding_bytes: 4294967296
  max_rows: 1000000
  max_dimension: 16384
  corpus_id: "war-trauma"
  version: ""
  # 路径必须相对 data.root；sidecar 不下载制品。
  corpus_path: null
  embedding_path: null
  corpus_sha256: ""
  embedding_sha256: ""
  embedding_model: ""
  license_id: ""

table:
  max_columns: 256
  max_rows: 10000
  max_cell_chars: 32768

imaging:
  max_volume_bytes: 536870912
  max_voxels: 536870912
  max_preview_slices: 64
  max_gallery_slices: 4096

# 扫描仅发生在 data.root/gallery 下；不会返回目录或报告正文。
gallery:
  enabled: false
  root: "gallery"
  max_cases_per_dataset: 10000
  max_slice_bytes: 52428800
  slice_extensions: [".png", ".jpg", ".jpeg", ".bmp", ".webp"]
  datasets: []
  # 启用示例：
  # datasets:
  #   - id: "demo-ct"
  #     path: "demo-ct"
  #     label: "演示 CT"
  #     modality: "CT"
  #     version: "2026-01"
  #     license_id: "customer-approved"
  #     report_names: ["report.txt", "report.md"]

# 默认只保存在进程内并按 TTL 清除，不持久化 PHI。
# filesystem 模式还要求 data.root、相对 root 和显式 persist_phi: true。
volume_storage:
  mode: "temporary"
  root: "volumes"
  default_ttl_seconds: 900
  max_ttl_seconds: 86400
  max_items: 32
  max_stored_bytes: 1073741824
  persist_phi: false

# 可选本机 M3D；只接受回环 origin，拒绝重定向并使用硬超时。
m3d:
  enabled: false
  endpoint: "http://127.0.0.1:8770"
  health_path: "/health"
  infer_path: "/v1/infer"
  timeout_seconds: 2
  max_response_bytes: 16777216

workflows:
  max_sources: 32
  max_source_chars: 100000
  max_total_chars: 500000
  max_output_chars: 2000000

